<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharkie</title>
    <link rel="shortcut icon" href="../img/assets/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/coin-bar.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/poison-bar.class.js"></script>
    <script src="models/poison-object.class.js"></script>
    <script src="models/puffer-fish.class.js"></script>
    <script src="models/jellyfish.class.js"></script>
    <script src="./js/keyboard.class.js"></script>
    <script src="models/barrier-object.class.js"></script>
    <script src="models/soundmanager.js"></script>
    <script src="./js/game.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/shootable-object.class.js"></script>
    <script src="models/coin-object.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="models/world.class.js"></script>




</head>

<body onload="init()">


    <div id="fullscreen" class="fullScreen">


        <canvas id="canvas" width="720" height="480"></canvas>

        <div class="settingsDiv">
            <button class="infoButton" id="infoButton" onclick="">i</button>
            <button type="button" class="audioButton" id="audioButton">🔇</button>
            <button class="fullscreenButton" id="fullscreenButton" onclick="fullscreen()">⛶</button>
        </div>

        <div id="mobileKeys" class="mobileKeys">
            <div class="arrowKeys">
                <button id="arrowLeft" class="arrowKey arrowLeft">
                    <img src="img/assets/img/arrow.png" alt="arrow key">
                </button>
                <div class="arrowUpDownDiv">
                    <button id="arrowUp" class="arrowKey arrowUp">
                        <img src="img/assets/img/arrow.png" alt="arrow key">
                    </button>
                    <button id="arrowDown" class="arrowKey arrowDown">
                        <img src="img/assets/img/arrow.png" alt="arrow key">
                    </button>
                </div>
                <button id="arrowRight" class="arrowKey arrowRight">
                    <img src="img/assets/img/arrow.png" alt="arrow key">
                </button>
            </div>
            <div id="actionKeys" class="actionkeys">
                <button id="spaceKey" class="spaceKey">⎵</button>
                <button id="strgKey" class="arrowKey strgKey">Strg</button>
            </div>
        </div>

        <div class="startScreen" id="startScreen">
            <div id="headLine" class="headLine">Sharkie</div>
            <img id="startScreenImg" class="startScreenImg" src="./img/3. Background/Mesa de trabajo 1.png"
                alt="Startscreen">
            <button type="button" onclick="startGame()" class="startButton" id="startButton">Start Game</button>
        </div>

    </div>

    <div id="rotateWarning" class="rotateWarning">
        <div class="rotateContent">
            <img src="./img/assets/img/rotate-icon.svg" alt="Rotate device" class="rotateIcon">
            <p>Bitte drehe dein Gerät ins Querformat, um weiterzuspielen.</p>
        </div>
    </div>
</body>

</html>
